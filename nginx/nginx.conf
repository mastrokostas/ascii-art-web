server {
    # Redirect http requests to https
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    # port 443 is a convention, tell nginx to expect TLS protocol by specifying ssl
    listen 443 ssl;
    server_name _;

    # SSL certs are in a bind mount in the box
    ssl_certificate     /etc/nginx/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;

    location / {
        # Prefix match on "/" catches every path — the Go mux does its own routing
        proxy_pass http://app:8080;

        # Pass the hostname the browser actually asked for, not "app:8080"
        proxy_set_header Host              $host;
        # The client's IP address
        proxy_set_header X-Real-IP         $remote_addr;
        # Append the client IP to any existing forwarding chain
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Tell the app the browser connected over https, not the plain http used inward
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}